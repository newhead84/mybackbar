# 취미용 공개 페이지(newhead84.github.io/whisky-backbar)를 배포한다.
# 같은 main을 두 저장소에 올리지만, 이 작업은 whisky-backbar 저장소에서만 돈다.
# 바 페이지 자료(bars/)는 빼고, 공유 미리보기 주소를 취미용 주소로 바꾼다.
name: hobby-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'newhead84/whisky-backbar'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 사이트 파일 모으기
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='.claude' --exclude='_site' \
            --exclude='bars' --exclude='CLAUDE.md' --exclude='.vercelignore' --exclude='README.md' ./ _site/
          sed -i 's#https://mybackbar.vercel.app/#https://newhead84.github.io/whisky-backbar/#g' _site/index.html
          grep -c 'newhead84.github.io/whisky-backbar/' _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  # 올리기와 배포를 나눈다(한 작업 안에서 바로 배포하면 올린 묶음을 못 찾아 실패한 적이 있음)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
