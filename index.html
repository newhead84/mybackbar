<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>위스키 백바</title>
<meta name="description" content="국내 위스키바에서 자주 보는 위스키를 종류별 선반에 진열하고, 병을 누르면 맛·도수·통·병 디자인을 보여 주는 페이지">
<meta name="theme-color" content="#0a0807">
<meta property="og:type" content="website">
<meta property="og:title" content="위스키 백바">
<meta property="og:description" content="국내 위스키바 선반에서 자주 보는 72병. 맛·도수·숙성 통과 비슷한 병을 한눈에.">
<meta property="og:url" content="https://newhead84.github.io/whisky-backbar/">
<meta property="og:image" content="https://newhead84.github.io/whisky-backbar/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap">
<style>
/* Layout: 스피크이지 라운지의 백바. 위쪽 고정 바(종류 탭·나라·맛·찾기) → 종류별 진열장(산지·세부 종류마다 유리 선반 한 칸) → 병을 누르면 오른쪽(휴대폰은 아래) 시트에 상세 */
@font-face{font-family:'Pretendard';src:url('fonts/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
:root{
  color-scheme: dark;
  --bg:#0a0807;            /* 바 뒷벽 */
  --bg-2:#110d0a;
  --panel:#15100c;         /* 상세 시트 */
  --panel-2:rgba(255,236,210,.045);
  --ink:#f5eee5;
  --ink-2:#c8bdb0;
  --ink-3:#8c8277;
  --line:rgba(255,236,210,.10);
  --line-2:rgba(255,236,210,.18);
  --amber:#f2aa4c;         /* 백라이트·강조 */
  --amber-soft:rgba(242,170,76,.16);
  --smoke:#9fb8ad;         /* 피트 표시 */
  --f-body:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-latin:'Space Grotesk','Pretendard',sans-serif;
  --H:176px;               /* 선반 위 병 높이(모두 같게) */
  --slot:92px;             /* 병 한 칸 폭(모두 같게) */
}
@media (max-width:640px){:root{--H:132px;--slot:72px}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(80% 50% at 50% -10%, rgba(242,170,76,.10), transparent 70%),
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 120px),
    var(--bg);
  min-height:100vh}
button,input{font:inherit;color:inherit}
h1,h2,h3,p,li,.lede{word-break:keep-all;overflow-wrap:break-word}
.wrap{max-width:1180px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.latin{font-family:var(--f-latin)}

/* 머리 */
header.top{padding:clamp(40px,8vw,88px) 0 26px}
.eyebrow{font-family:var(--f-latin);font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--amber);display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px var(--amber)}
h1{font-weight:800;font-size:clamp(34px,6.4vw,68px);line-height:1.08;letter-spacing:-.035em;margin:16px 0 14px;text-wrap:balance}
h1 em{font-style:normal;color:var(--amber)}
.lede{color:var(--ink-2);max-width:60ch;margin:0;font-size:16px;text-wrap:pretty}
.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:26px;font-family:var(--f-latin)}
.stats div{display:flex;flex-direction:column}
.stats b{font-weight:500;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.stats span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
@media (max-width:480px){.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:12px}.stats b{font-size:24px}.stats span{font-size:9.5px;letter-spacing:.12em}}

/* 고정 바 */
.bar{position:sticky;top:0;z-index:30;background:rgba(10,8,7,.78);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:0 4px;padding-top:10px}
.tab{flex:0 0 auto;background:none;border:0;padding:10px 14px 12px;cursor:pointer;color:var(--ink-3);font-weight:600;font-size:15px;position:relative;white-space:nowrap;transition:color .15s}
.tab small{font-family:var(--f-latin);font-weight:400;font-size:11px;margin-left:5px;color:var(--ink-3)}
.tab:hover{color:var(--ink-2)}
.tab[aria-pressed="true"]{color:var(--ink)}
.tab[aria-pressed="true"]::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;border-radius:2px;background:var(--amber);box-shadow:0 0 10px var(--amber)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0 12px}
.search{flex:1 1 150px;min-width:0;max-width:340px;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.search svg{flex:none;opacity:.6}
.search input{flex:1;min-width:0;width:100%;background:none;border:0;outline:0;font-size:14px;height:100%}
.search input::placeholder{color:var(--ink-3)}
.search:focus-within{border-color:var(--amber)}
.sep{flex:none;width:1px;height:20px;background:var(--line-2);margin:0 4px}
.chip{flex:0 0 auto;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);cursor:pointer;font-size:13.5px;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#120d09;font-weight:600}
.chip.flav[aria-pressed="true"]{background:var(--amber);border-color:var(--amber)}
.count{flex:none;margin-left:auto;padding-left:8px;font-family:var(--f-latin);font-size:12px;letter-spacing:.12em;color:var(--ink-3);white-space:nowrap}
.chipbox{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px 18px}
.cgroup{display:flex;flex-wrap:wrap;gap:6px}
.chip.fav[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#120d09}
.ftoggle{display:none}
.ftoggle b{font-family:var(--f-latin);font-weight:600;margin-left:6px;color:var(--amber)}
.ftoggle b:empty{display:none}
@media (max-width:900px){.ftoggle{display:inline-block}.chipbox{display:none;padding-top:2px}.chipbox.open{display:flex}}
@media (max-width:640px){
  .tab{padding:8px 10px 10px;font-size:14px}
  .tab[aria-pressed="true"]::after{left:10px;right:10px}
  .chip{height:32px;padding:0 11px;font-size:13px}
}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* 종류별 진열장 */
.style{padding-top:56px;scroll-margin-top:120px}
.style-head{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line)}
.style-no{grid-row:span 2;font-family:var(--f-latin);font-weight:300;font-size:clamp(44px,7vw,72px);line-height:.9;color:var(--amber);letter-spacing:-.04em}
.style-en{font-family:var(--f-latin);font-size:11.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-3)}
.style-head h2{margin:2px 0 0;font-weight:800;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.03em;line-height:1.15}
.style-head p{grid-column:1/-1;margin:10px 0 0;color:var(--ink-2);max-width:62ch;text-wrap:pretty}
.cabinet{margin-top:22px}
/* 선반 이름표: 산지·세부 종류가 시작되는 자리에 병 한 칸 크기로 놓음 */
.plate{justify-self:stretch;align-self:start;height:var(--H);display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:0 4px 14px;min-width:0;word-break:keep-all;border-left:1px solid var(--amber);background:linear-gradient(90deg,var(--amber-soft),transparent 80%)}
.plate b{font-weight:700;font-size:14px;line-height:1.25;color:var(--ink)}
.plate span{font-family:var(--f-latin);font-size:12px;color:var(--amber)}
.plate i{font-style:normal;color:var(--ink-3);font-size:12px;line-height:1.35}
@media (max-width:640px){.plate b{font-size:13px}.plate i{font-size:11px}}

/* 유리 선반 한 칸: 뒤 벽 백라이트 + 위쪽 LED 줄 + 유리판 + 바닥 반사 */
.cabinet{position:relative;border-radius:14px;overflow:hidden;
  background:
    radial-gradient(70% 90% at 50% 0%, rgba(242,170,76,.20), rgba(242,170,76,0) 70%),
    linear-gradient(180deg,#17110c 0%,#0d0a08 100%);
  box-shadow:inset 0 0 0 1px rgba(255,236,210,.06), inset 0 -40px 60px rgba(0,0,0,.45)}
.cabinet::before{content:"";position:absolute;left:4%;right:4%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--amber) 15%,#ffd9a0 50%,var(--amber) 85%,transparent);box-shadow:0 0 18px 2px rgba(242,170,76,.55);z-index:1;pointer-events:none}
/* 한 종류 안의 칸들: 병이 적은 칸은 옆으로 나란히, 많은 칸은 여러 층으로 접힘(가로 스크롤 없음) */
.track{--gx:clamp(6px,1.4vw,14px);--gy:22px;--px:clamp(12px,2.4vw,26px);--L:calc(var(--H) + 54px + var(--gy));
  display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--slot),1fr));justify-items:center;column-gap:var(--gx);row-gap:var(--gy);
  padding:34px var(--px) 12px;position:relative;
  /* 층마다 유리판: 병 높이 바로 아래에 9px 판, 한 층(L)마다 반복 */
  background:linear-gradient(180deg,transparent var(--H),rgba(255,248,236,.55) var(--H),rgba(255,244,228,.30) calc(var(--H) + 1px),rgba(255,244,228,.06) calc(var(--H) + 5px),rgba(255,244,228,.12) calc(var(--H) + 9px),transparent calc(var(--H) + 9px)) 0 34px / 100% var(--L) repeat-y}
.bt{width:var(--slot);display:flex;flex-direction:column;align-items:center;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bt .stand{width:100%;height:var(--H);display:flex;align-items:flex-end;justify-content:center;position:relative}
.bt .stand::before{ /* 고를 때 위에서 비추는 조명 */
  content:"";position:absolute;inset:-30px -18px 0;background:radial-gradient(50% 60% at 50% 30%,rgba(255,214,150,.22),transparent 70%);opacity:0;transition:opacity .2s;pointer-events:none}
.bt img,.bt .svgb{display:block;height:var(--H);width:var(--slot);object-fit:contain;object-position:50% 100%;
  filter:drop-shadow(0 10px 10px rgba(0,0,0,.55)) brightness(.94);
  -webkit-box-reflect:below 9px linear-gradient(transparent 78%,rgba(255,255,255,.16));
  transition:transform .22s cubic-bezier(.2,.7,.2,1),filter .22s}
.bt .svgb svg{height:100%;width:auto;display:block;margin:0 auto}
.bt .nm{margin-top:22px;font-size:12px;line-height:1.3;color:var(--ink-3);text-align:center;word-break:keep-all;height:32px;width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:color .2s}
.bt:hover img,.bt:hover .svgb,.bt:focus-visible img,.bt:focus-visible .svgb{transform:translateY(-8px);filter:drop-shadow(0 16px 14px rgba(0,0,0,.6)) brightness(1.06)}
.bt:hover .stand::before,.bt:focus-visible .stand::before{opacity:1}
.bt:hover .nm,.bt:focus-visible .nm{color:var(--ink)}
.bt:focus-visible{outline:none}
.bt:focus-visible .nm{text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:4px}
.empty{color:var(--ink-3);padding:60px 0;text-align:center}

/* 상세 시트 */
.scrim{position:fixed;inset:0;background:rgba(5,3,2,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;top:0;right:0;bottom:0;width:min(580px,100%);background:linear-gradient(180deg,#1a130e,#100c09 60%);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.on{transform:none}
@media (max-width:640px){
  .sheet{top:auto;left:0;width:100%;max-height:92%;border-left:0;border-top:1px solid var(--line-2);border-radius:20px 20px 0 0;transform:translateY(102%);padding-left:env(safe-area-inset-left,0px)}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:10px auto 0}
}
.sheet-in{padding:18px 24px 36px;display:flex;flex-direction:column;gap:22px}
.close{position:sticky;top:6px;align-self:flex-end;margin:0 -8px -50px 0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);background:rgba(20,15,11,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);cursor:pointer;z-index:3;display:grid;place-items:center}
.d-hero{display:grid;grid-template-columns:150px 1fr;gap:22px;align-items:end;padding-top:6px}
.d-stage{position:relative;height:270px;display:flex;align-items:flex-end;justify-content:center;border-radius:16px;
  background:radial-gradient(60% 55% at 50% 45%,rgba(242,170,76,.30),transparent 72%),linear-gradient(180deg,rgba(255,236,210,.04),rgba(255,236,210,0));overflow:hidden}
.d-stage::after{content:"";position:absolute;left:10%;right:10%;bottom:26px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,248,236,.5),transparent)}
.d-stage img,.d-stage .svgb{height:220px;width:auto;max-width:130px;object-fit:contain;margin-bottom:26px;filter:drop-shadow(0 14px 14px rgba(0,0,0,.6));-webkit-box-reflect:below 1px linear-gradient(transparent 80%,rgba(255,255,255,.18))}
.d-stage .svgb svg{height:100%;width:auto}
.d-kicker{font-family:var(--f-latin);font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber)}
.d-hero h2{font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.15;margin:8px 0 0;text-wrap:balance}
.d-en{font-family:var(--f-latin);font-size:14px;color:var(--ink-3);margin-top:4px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.pill{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}
@media (max-width:640px){.d-hero{grid-template-columns:118px 1fr;gap:16px}.d-stage{height:210px}.d-stage img,.d-stage .svgb{height:168px}.d-hero h2{font-size:24px}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.fact{background:#130e0b;padding:12px 12px 10px;min-width:0}
.fact b{display:block;font-family:var(--f-latin);font-weight:500;font-size:20px;letter-spacing:-.02em;line-height:1.2;word-break:keep-all}
.fact b.ko{font-family:var(--f-body);font-weight:700;font-size:16px;padding-top:3px}
.fact span{font-size:11.5px;color:var(--ink-3)}
@media (max-width:420px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sec h3{margin:0 0 10px;font-size:11.5px;font-family:var(--f-latin);font-weight:500;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-3);display:flex;gap:8px;align-items:center}
.sec h3 span{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:14px;font-weight:700;color:var(--ink)}
.sec p{margin:0;color:var(--ink-2);text-wrap:pretty}
.meters{display:grid;gap:10px}
.meter{display:grid;grid-template-columns:78px 1fr 34px;gap:12px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.bar-track{height:6px;border-radius:3px;background:rgba(255,236,210,.08);overflow:hidden}
.bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#b8742b,var(--amber));box-shadow:0 0 10px rgba(242,170,76,.4)}
.bar-fill.peat{background:linear-gradient(90deg,#5f7a6f,var(--smoke));box-shadow:none}
.meter em{font-style:normal;font-family:var(--f-latin);font-size:12px;color:var(--ink-3);text-align:right}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.note{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.note small{display:block;font-family:var(--f-latin);font-size:10.5px;letter-spacing:.22em;color:var(--amber);text-transform:uppercase}
.note div{font-size:14px;margin-top:4px;color:var(--ink)}
@media (max-width:420px){.notes{grid-template-columns:1fr}}
.sim{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 2px;--H:104px;--slot:64px}
.sim .bt .nm{margin-top:14px;font-size:11.5px}
.sim .bt img,.sim .bt .svgb{-webkit-box-reflect:unset}
.credit{font-size:12px;color:var(--ink-3);line-height:1.55}
.credit a{color:var(--ink-2)}
.foot{color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line);padding-top:14px}
footer.site{color:var(--ink-3);font-size:12.5px;padding-block:56px 48px;line-height:1.7}
footer.site details{margin-top:12px}
footer.site summary{cursor:pointer;color:var(--ink-2)}
footer.site ul{margin:10px 0 0;padding-left:18px;columns:2;column-gap:28px}
footer.site li{break-inside:avoid;margin-bottom:4px}
footer.site a{color:var(--ink-2)}
@media (max-width:640px){footer.site ul{columns:1}}
/* 내 관심 별 */
.bt .stand{position:relative}
.star{position:absolute;top:-4px;right:8%;font-size:13px;line-height:1;color:var(--amber);text-shadow:0 0 8px rgba(242,170,76,.7);pointer-events:none}
/* 상세 시트 버튼 */
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.act{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer;font-size:13px;white-space:nowrap}
.act:hover{color:var(--ink);border-color:var(--ink-3)}
.act[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--ink)}
.act:disabled{opacity:.45;cursor:default}
/* 비슷한 병: 가로 스크롤 대신 접어서 */
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--slot),1fr));justify-items:center;gap:14px 6px;overflow:visible}
.sim .star{display:none}
/* 비교 바구니 */
.tray{position:fixed;z-index:35;left:50%;bottom:max(12px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100% - 24px));
  background:rgba(24,18,13,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.tray-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px}
.tray-list{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 220px;min-width:0}
.tray-item{display:inline-flex;align-items:center;gap:2px;font-size:13px;padding:3px 4px 3px 10px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.tray-item button{width:24px;height:24px;border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:15px;line-height:1}
.tray-btns{display:flex;gap:6px;margin-left:auto}
.chip.go{background:var(--amber);border-color:var(--amber);color:#120d09;font-weight:600}
.chip.go:disabled{background:transparent;border-color:var(--line);color:var(--ink-3);font-weight:400;cursor:default}
body.has-tray footer.site{padding-bottom:120px}
/* 비교 화면 */
.sheet:has(.cmp){width:min(860px,100%)}
.cmp-title{font-weight:800;font-size:26px;letter-spacing:-.03em;margin:8px 0 0}
.cmp-head,.cmp-row{display:grid;grid-template-columns:72px repeat(var(--c),minmax(0,1fr));gap:10px}
.cmp-head::before{content:""}
.cmp-bottle{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:center;min-width:0;word-break:keep-all}
.cmp-img{height:150px;display:flex;align-items:flex-end;justify-content:center}
.cmp-img img,.cmp-img .svgb{height:150px;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 10px 10px rgba(0,0,0,.55))}
.cmp-img .svgb svg{height:100%;width:auto}
.cmp-bottle b{font-size:14px;line-height:1.3;margin-top:6px}
.cmp-bottle small{font-size:11.5px;color:var(--ink-3)}
.cmp-table{display:grid;border-top:1px solid var(--line)}
.cmp-row{padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.cmp-k{font-size:12.5px;color:var(--ink-3)}
.cmp-v{font-size:13.5px;color:var(--ink);min-width:0;word-break:keep-all;overflow-wrap:break-word;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.cmp-v:not(:has(.bar-track)){display:block}
.cmp-v em{font-style:normal;font-family:var(--f-latin);font-size:11px;color:var(--ink-3)}
@media (max-width:640px){
  .cmp-head,.cmp-row{grid-template-columns:repeat(var(--c),minmax(0,1fr))}
  .cmp-head::before{display:none}
  .cmp-k{grid-column:1/-1;font-size:12px;margin-bottom:-4px}
  .cmp-img,.cmp-img img,.cmp-img .svgb{height:120px}
  .cmp-v{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.bt img,.bt .svgb,.sheet,.scrim,.bt .stand::before{transition:none}}
</style>

// 병 모양: [전체 높이, 몸통 너비, 어깨 높이(위에서), 목 너비, 목 길이, 어깨 곡률]
const SHAPES = {
  std:[150,40,62,12,30,14], tall:[164,36,74,11,40,10], round:[138,46,58,12,22,22],
  square:[146,46,56,13,26,6], tri:[150,42,60,12,30,12], flask:[146,44,54,13,24,4],
  block:[110,50,36,16,14,6], deca:[126,50,48,14,18,8], jug:[136,46,50,14,20,20]
};
let gid=0;
function bottleSVG(o, scale){
  const [H,W,Sh,N,NL,R] = SHAPES[o.sh]||SHAPES.std;
  const vbW=64, vbH=170, cx=vbW/2, base=vbH-2, top=base-H;
  const x0=cx-W/2, x1=cx+W/2, nx0=cx-N/2, nx1=cx+N/2;
  const shY=top+Sh, neckY=top+NL;
  const id='g'+(gid++);
  const gl = GLASS[o.g]||GLASS.clear;
  let body;
  if(o.sh==='round'||o.sh==='jug'){
    body=`M${nx0},${top+6} L${nx0},${neckY} C${nx0},${shY-8} ${x0},${shY-10} ${x0},${shY+8} L${x0},${base-R/2} Q${x0},${base} ${x0+R/2},${base} L${x1-R/2},${base} Q${x1},${base} ${x1},${base-R/2} L${x1},${shY+8} C${x1},${shY-10} ${nx1},${shY-8} ${nx1},${neckY} L${nx1},${top+6} Z`;
  } else if(o.sh==='square'||o.sh==='flask'||o.sh==='block'||o.sh==='deca'){
    body=`M${nx0},${top+6} L${nx0},${neckY} L${x0+R},${shY-4} Q${x0},${shY} ${x0},${shY+R} L${x0},${base-3} Q${x0},${base} ${x0+3},${base} L${x1-3},${base} Q${x1},${base} ${x1},${base-3} L${x1},${shY+R} Q${x1},${shY} ${x1-R},${shY-4} L${nx1},${neckY} L${nx1},${top+6} Z`;
  } else {
    body=`M${nx0},${top+6} L${nx0},${neckY} C${nx0},${shY-6} ${x0},${shY-R} ${x0},${shY+4} L${x0},${base-3} Q${x0},${base} ${x0+3},${base} L${x1-3},${base} Q${x1},${base} ${x1},${base-3} L${x1},${shY+4} C${x1},${shY-R} ${nx1},${shY-6} ${nx1},${neckY} L${nx1},${top+6} Z`;
  }
  const ceramic = o.g==='ceramic';
  const fill = ceramic ? o.l : gl.fill;
  // 라벨
  const lw=W-8, lh=Math.min(46,(base-shY)*0.5), ly=base-lh-(o.sh==='block'?10:16);
  const lx=cx-lw/2;
  const lightLabel = lum(o.l)>0.5;
  const ltext = lightLabel? '#2a1d12':'#f3e7cf';
  const labelColor = ceramic? '#f2ead8' : o.l;
  const ltxt = ceramic? '#2c3e7a' : ltext;
  const tilt = o.tilt? `rotate(-12 ${cx} ${ly+lh/2})` : '';
  const fs = String(o.lb).length>=3?10:(String(o.lb).length===2?12:15);
  let extras='';
  if(o.sh==='tri'){ extras+=`<line x1="${cx}" y1="${shY+6}" x2="${cx}" y2="${base-2}" stroke="rgba(255,255,255,.16)" stroke-width="1"/>`; }
  if(o.sh==='deca'){ for(let i=1;i<6;i++){const xx=x0+i*W/6; extras+=`<line x1="${xx}" y1="${shY+2}" x2="${xx}" y2="${base-2}" stroke="rgba(255,255,255,.10)"/>`;} }
  if(o.turtle){ for(let r=0;r<3;r++)for(let c=0;c<3;c++){const hx=x0+6+c*(W-12)/2, hy=shY+8+r*9; extras+=`<path d="M${hx-4},${hy} l2,-3 h4 l2,3 l-2,3 h-4z" fill="none" stroke="rgba(255,255,255,.14)"/>`;} }
  const capH = o.wax?16:12;
  let cap = `<rect x="${nx0-1.5}" y="${top}" width="${N+3}" height="${capH}" rx="2" fill="${o.cap}"/>`;
  if(o.wax){ cap += `<path d="M${nx0-1.5},${top+capH-2} q3,10 5,2 q2,12 5,0 q3,8 4,-1 l0,-1 Z" fill="${o.cap}"/><path d="M${nx1+1.5},${top+capH-2} q-2,9 -4,1 l0,-1Z" fill="${o.cap}"/>`; }
  if(o.horse){ cap += `<path d="M${cx-6},${top-2} q4,-10 9,-8 q3,1 4,4 l-3,1 l-2,-2 q-2,2 -1,6 l-2,0 l-1,-4 l-3,4 z" fill="#c9a46a"/>`; }
  if(o.sh==='deca' && !o.horse){ cap = `<rect x="${nx0-3}" y="${top-2}" width="${N+6}" height="${capH+2}" rx="3" fill="${o.cap}"/>`; }
  const w = Math.round(vbW*scale), h=Math.round(vbH*scale);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${vbW} ${vbH}" aria-hidden="true">
  <defs>
    <linearGradient id="liq" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a3f10"/><stop offset=".45" stop-color="#c8781f"/><stop offset="1" stop-color="#6a330c"/></linearGradient>
    <linearGradient id="sh${id}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".18" stop-color="#fff" stop-opacity=".28"/><stop offset=".3" stop-color="#fff" stop-opacity=".0"/><stop offset=".85" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
    <clipPath id="c${id}"><path d="${body}"/></clipPath>
  </defs>
  <path d="${body}" fill="${fill}" stroke="${gl.stroke}" stroke-width="1"/>
  ${o.g==='clear'?`<rect x="0" y="${top}" width="${vbW}" height="${neckY-top+4}" fill="rgba(240,230,210,.18)" clip-path="url(#c${id})"/>`:''}
  <g clip-path="url(#c${id})">${extras}</g>
  <g transform="${tilt}"><rect x="${lx}" y="${ly}" width="${lw}" height="${lh}" rx="2" fill="${labelColor}"/>
  <text x="${cx}" y="${ly+lh/2+fs*0.36}" text-anchor="middle" font-family="Pretendard, sans-serif" font-weight="700" font-size="${fs}" fill="${ltxt}">${esc(o.lb)}</text></g>
  <path d="${body}" fill="url(#sh${id})"/>
  ${cap}
</svg>`;
}
function lum(hex){const h=hex.replace('#','');const f=h.length===3?h.split('').map(x=>x+x).join(''):h;const r=parseInt(f.slice(0,2),16)/255,g=parseInt(f.slice(2,4),16)/255,b=parseInt(f.slice(4,6),16)/255;return .299*r+.587*g+.114*b}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function classify(o){
  const t=o.t;
  if(/팟 스틸/.test(t)) return ['potstill','all'];
  if(/그레인/.test(t)) return ['grain','all'];
  if(/테네시/.test(t)) return ['american','tennessee'];
  if(/라이/.test(t)) return ['american','rye'];
  if(/버번/.test(t)) return ['american','bourbon'];
  if(/블렌디드/.test(t)){
    if(/몰트/.test(t)) return ['blend','malt'];
    if(/재패니즈/.test(t)) return ['blend','japan'];
    if(/아이리시|캐나디안/.test(t)) return ['blend','other'];
    return ['blend','scotch'];
  }
  return ['single', o.c];
}
function nationOf(o){
  const n=o.r.split(' · ')[0];
  return n==='북아일랜드'?'아일랜드':n;
}
B.forEach(o=>{const [s,row]=classify(o);o.st=s;o.row=row;o.nat=nationOf(o)});
const NATIONS = (()=>{const m={};B.forEach(o=>m[o.nat]=(m[o.nat]||0)+1);return Object.keys(m).sort((a,b)=>m[b]-m[a])})();

const FLAVS = [
  {id:'smoky',n:'스모키',f:o=>o.p>=2},
  {id:'sherry',n:'셰리',f:o=>o.sy>=2},
  {id:'sweet',n:'달콤',f:o=>o.s>=4},
  {id:'light',n:'가벼움',f:o=>o.b<=2},
  {id:'strong',n:'고도수',f:o=>typeof o.abv==='number'?o.abv>=48:/약 6/.test(o.abv)},
  {id:'highball',n:'하이볼',f:o=>/하이볼/.test(o.drink)}
];
// 실제 바처럼 병 높이를 조금씩 다르게(모양 기준)
const SH_K = {std:1, tall:1.07, round:.94, square:.97, tri:1, flask:.9, block:.8, deca:.92, jug:.9};
const state={style:'all',nat:'all',flav:new Set(),q:'',favOnly:false};
// 내 관심(★)·비교 목록: 이 기기 브라우저에만 저장
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return Array.isArray(v)?v:d}catch(_){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
const valid=a=>a.filter(id=>B.some(o=>o.id===id));
const fav=new Set(valid(store.get('bb-fav',[])));
let cmp=valid(store.get('bb-cmp',[])).slice(0,3);
const CMP_MAX=3;

function face(o, big){
  const p=PH[o.id];
  const k = big?1:(SH_K[o.sh]||1);
  if(p) return `<img src="${p.f}" alt="" width="${p.w}" height="${p.h}" loading="lazy" decoding="async">`;
  return `<span class="svgb">${bottleSVG(o,1)}</span>`;
}
function btn(o){const f=fav.has(o.id);return `<button class="bt" data-id="${o.id}" aria-label="${esc(o.n)} 자세히 보기${f?' (관심)':''}"><span class="stand">${face(o)}${f?'<span class="star" aria-hidden="true">★</span>':''}</span><span class="nm">${esc(o.n)}</span></button>`}

function renderStats(){
  const photo=B.filter(o=>PH[o.id]).length;
  document.getElementById('stats').innerHTML=
    `<div><b>${B.length}</b><span>Bottles</span></div><div><b>${STYLES.length}</b><span>Styles</span></div><div><b>${NATIONS.length}</b><span>Countries</span></div><div><b>${photo}</b><span>Bottles drawn</span></div>`;
}
function renderControls(){
  const cnt=id=>B.filter(o=>(id==='all'||o.st===id)).length;
  document.getElementById('tabs').innerHTML=[{id:'all',n:'전체'}].concat(STYLES)
    .map(s=>`<button class="tab" data-style="${s.id}" aria-pressed="${state.style===s.id}">${s.n}<small>${cnt(s.id)}</small></button>`).join('');
  document.getElementById('nations').innerHTML=['all'].concat(NATIONS)
    .map(n=>`<button class="chip" data-nat="${n}" aria-pressed="${state.nat===n}">${n==='all'?'모든 나라':n}</button>`).join('');
  document.getElementById('flavs').innerHTML=FLAVS
    .map(f=>`<button class="chip flav" data-flav="${f.id}" aria-pressed="${state.flav.has(f.id)}">${f.n}</button>`).join('')
    +`<button class="chip fav" data-favonly aria-pressed="${state.favOnly}">★ 내 관심 ${fav.size}</button>`;
  const n=(state.nat!=='all'?1:0)+state.flav.size+(state.favOnly?1:0);
  document.getElementById('fcount').textContent=n||'';
}
function matches(o){
  if(state.favOnly&&!fav.has(o.id))return false;
  if(state.nat!=='all'&&o.nat!==state.nat)return false;
  if(state.q){const q=state.q.toLowerCase();const hay=[o.n,o.e,o.r,o.t,o.nose,o.pal,o.fin,o.cask,o.design].join(' ').toLowerCase();if(!hay.includes(q))return false}
  for(const f of state.flav){if(!FLAVS.find(x=>x.id===f).f(o))return false}
  return true;
}
function renderShelves(){
  const el=document.getElementById('shelves');
  let html='',shown=0,no=0;
  for(const s of STYLES){
    no++;
    if(state.style!=='all'&&state.style!==s.id)continue;
    let rows='';
    for(const [rid,rn,rhint] of s.rows){
      const hit=B.filter(o=>o.st===s.id&&o.row===rid&&matches(o));
      if(!hit.length)continue;
      shown+=hit.length;
      rows+=`<div class="plate" role="heading" aria-level="3"><b>${rn}</b><span>${hit.length}</span><i>${rhint}</i></div>${hit.map(btn).join('')}`;
    }
    if(!rows)continue;
    html+=`<section class="style" id="s-${s.id}" aria-label="${s.n} 진열장"><div class="style-head"><div class="style-no">${String(no).padStart(2,'0')}</div><div class="style-en">${s.en}</div><h2>${s.n}</h2><p>${s.d}</p></div><div class="cabinet"><div class="track">${rows}</div></div></section>`;
  }
  el.innerHTML=html||`<p class="empty">조건에 맞는 병이 없습니다. 나라나 맛 필터를 하나 풀어 보세요.</p>`;
  document.getElementById('count').textContent=`${shown} / ${B.length}`;
}
function renderFoot(){
  const list=B.filter(o=>PH[o.id]).map(o=>{const p=PH[o.id];return `<li>${esc(o.n)}: ${esc(p.a)} · ${esc(p.l)} · <a href="${p.u}" target="_blank" rel="noopener">원본</a>${p.n?` (${esc(p.n)})`:''}</li>`}).join('');
  document.getElementById('site-foot').innerHTML=`맛 표현과 수치는 일반적으로 알려진 내용을 줄인 것이고, 맛 점수는 병끼리 비교하려고 붙인 대략적인 값입니다. 도수와 라벨은 제품 연도·수입 판에 따라 다를 수 있습니다.<br>병 이미지는 위키미디어 공용의 자유 라이선스 사진을 참고해 AI(GPT 이미지)로 정면·투명 배경으로 다시 그린 것입니다. 라벨 글자가 실제와 조금 다를 수 있고, 참고 사진의 작가와 라이선스를 함께 적었습니다(CC BY-SA 사진에서 나온 이미지는 같은 라이선스를 따릅니다). 사진을 찾지 못한 병은 모양과 색만 단순한 그림으로 그렸습니다.
  <details><summary>참고 사진 출처 전체 보기 (${B.filter(o=>PH[o.id]).length}장)</summary><ul>${list}</ul></details>`;
}

const PEAT=['없음','약함','중간','강함','아주 강함'];
function similar(o){
  return B.filter(x=>x.id!==o.id).map(x=>({x,d:Math.abs(x.p-o.p)*1.6+Math.abs(x.b-o.b)+Math.abs(x.s-o.s)+Math.abs(x.sy-o.sy)*1.2+(x.st===o.st?-.3:0)}))
    .sort((a,b)=>a.d-b.d).slice(0,6).map(a=>a.x);
}
function level(o){
  const hard=(o.p>=3?2:0)+(typeof o.abv==='number'&&o.abv>=48?2:(String(o.abv).startsWith('약 6')?2:0))+(o.b>=5?1:0);
  return hard>=3?'경험자용':hard>=1?'중급':'입문';
}
function meter(label,v,max,cls){return `<div class="meter">${label}<div class="bar-track"><div class="bar-fill ${cls||''}" style="width:${Math.round(v/max*100)}%"></div></div><em>${v}/${max}</em></div>`}
function openDetail(id,push){
  const o=B.find(b=>b.id===id); if(!o)return;
  const s=STYLES.find(x=>x.id===o.st); const row=s.rows.find(r=>r[0]===o.row);
  const abvNum = typeof o.abv==='number';
  const abv = abvNum? o.abv+'%' : o.abv+(String(o.abv).startsWith('약')?'%':'');
  const p=PH[o.id];
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=`<div class="sheet-in">
    <button class="close" id="close" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="d-hero"><div class="d-stage">${face(o,true)}</div>
      <div><div class="d-kicker">${esc(s.en)}</div><h2 id="d-name">${esc(o.n)}</h2><div class="d-en">${esc(o.e)}</div>
      <div class="pills"><span class="pill">${esc(o.t)}</span><span class="pill">${esc(o.r)}</span>${row&&o.st==='single'?'':`<span class="pill">${esc(row?row[1]:'')}</span>`}</div>
      <div class="acts">${actBtns(o.id)}</div></div></div>
    <div class="facts">
      <div class="fact"><b class="${abvNum?'':'ko'}">${esc(abv)}</b><span>도수</span></div>
      <div class="fact"><b class="ko">${esc(o.age)}</b><span>숙성</span></div>
      <div class="fact"><b class="ko">${PEAT[o.p]}</b><span>피트</span></div>
      <div class="fact"><b class="ko">${level(o)}</b><span>난이도</span></div>
    </div>
    <div class="sec"><h3>Cask <span>숙성 통</span></h3><p>${esc(o.cask)}</p></div>
    <div class="sec"><h3>Profile <span>맛의 결</span></h3><div class="meters">
      ${meter('피트·연기',o.p,4,'peat')}${meter('무게감',o.b,5)}${meter('단맛·과일',o.s,5)}${meter('셰리 영향',o.sy,3)}
    </div></div>
    <div class="sec"><h3>Tasting <span>테이스팅 노트</span></h3><div class="notes">
      <div class="note"><small>Nose · 향</small><div>${esc(o.nose)}</div></div>
      <div class="note"><small>Palate · 맛</small><div>${esc(o.pal)}</div></div>
      <div class="note"><small>Finish · 여운</small><div>${esc(o.fin)}</div></div>
    </div></div>
    <div class="sec"><h3>Serve <span>이렇게 마셔 보세요</span></h3><p>${esc(o.drink)}</p></div>
    <div class="sec"><h3>Bottle <span>병 디자인</span></h3><p>${esc(o.design)}</p></div>
    <div class="sec"><h3>Story <span>알아 두면 좋은 이야기</span></h3><p>${esc(o.fact)}</p></div>
    <div class="sec"><h3>Similar <span>비슷한 맛의 병</span></h3><div class="sim">${similar(o).map(btn).join('')}</div></div>
    ${p?`<p class="credit">참고 사진: ${esc(p.a)} · ${esc(p.l)} · <a href="${p.u}" target="_blank" rel="noopener">위키미디어 공용 원본</a> · AI(GPT 이미지)로 다시 그린 병 · 라벨 글자가 실제와 다를 수 있음${p.n?` · ${esc(p.n)}`:''}</p>`:`<p class="credit">이 병은 자유 이용 사진을 찾지 못해 모양과 색만 그림으로 그렸습니다.</p>`}
    <p class="foot">비슷한 병은 피트·무게감·단맛·셰리 점수가 가까운 순서입니다. 점수는 이 페이지에서 비교하려고 붙인 대략적인 값입니다.</p>
  </div>`;
  sheet.hidden=false; sheet.scrollTop=0;
  requestAnimationFrame(()=>{sheet.classList.add('on');document.getElementById('scrim').classList.add('on')});
  if(push!==false && location.hash!=='#b-'+id){ try{history.pushState(null,'','#b-'+id)}catch(e){} }
  setTimeout(()=>document.getElementById('close')?.focus({preventScroll:true}),60);
}
function actBtns(id){
  const f=fav.has(id), c=cmp.includes(id), full=!c&&cmp.length>=CMP_MAX;
  return `<button class="act" data-fav="${id}" aria-pressed="${f}">${f?'★ 관심 표시함':'☆ 관심 표시'}</button>`
    +`<button class="act" data-cmp="${id}" aria-pressed="${c}" ${full?'disabled':''}>${c?'비교에서 빼기':full?'비교는 3병까지':'+ 비교에 담기'}</button>`;
}
function refreshActs(){document.querySelectorAll('.acts').forEach(a=>{const id=a.querySelector('[data-fav]')?.dataset.fav;if(id)a.innerHTML=actBtns(id)})}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);store.set('bb-fav',[...fav]);refreshActs();renderControls();renderShelves()}
function toggleCmp(id){const i=cmp.indexOf(id);if(i>=0)cmp.splice(i,1);else if(cmp.length<CMP_MAX)cmp.push(id);store.set('bb-cmp',cmp);refreshActs();renderTray()}
function renderTray(){
  const t=document.getElementById('tray');
  if(!cmp.length){t.hidden=true;document.body.classList.remove('has-tray');return}
  t.hidden=false;document.body.classList.add('has-tray');
  const items=cmp.map(id=>B.find(o=>o.id===id));
  t.innerHTML=`<div class="tray-in"><div class="tray-list">${items.map(o=>`<span class="tray-item">${esc(o.n)}<button data-cmpx="${o.id}" aria-label="${esc(o.n)} 비교에서 빼기">×</button></span>`).join('')}</div>
    <div class="tray-btns"><button class="chip" data-cmpclear>비우기</button><button class="chip go" data-cmpopen ${items.length<2?'disabled':''}>${items.length<2?'한 병 더 담기':`${items.length}병 비교하기`}</button></div></div>`;
}
function openSheet(html,hash,push){
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=html; sheet.hidden=false; sheet.scrollTop=0;
  requestAnimationFrame(()=>{sheet.classList.add('on');document.getElementById('scrim').classList.add('on')});
  if(push!==false && location.hash!==hash){ try{history.pushState(null,'',hash)}catch(e){} }
  setTimeout(()=>document.getElementById('close')?.focus({preventScroll:true}),60);
}
const CLOSE_BTN=`<button class="close" id="close" aria-label="닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;
function openCompare(push){
  const items=cmp.map(id=>B.find(o=>o.id===id));
  if(items.length<2){closeDetail(true);return}
  const abvTxt=o=>typeof o.abv==='number'?o.abv+'%':o.abv+(String(o.abv).startsWith('약')?'%':'');
  const bar=(v,max,cls)=>`<div class="bar-track"><div class="bar-fill ${cls||''}" style="width:${Math.round(v/max*100)}%"></div></div><em>${v}/${max}</em>`;
  const rowOf=(label,fn)=>`<div class="cmp-row"><div class="cmp-k">${label}</div>${items.map(o=>`<div class="cmp-v">${fn(o)}</div>`).join('')}</div>`;
  openSheet(`<div class="sheet-in cmp" style="--c:${items.length}">${CLOSE_BTN}
    <div><div class="d-kicker">Compare</div><h2 id="d-name" class="cmp-title">${items.length}병 나란히 보기</h2></div>
    <div class="cmp-head">${items.map(o=>`<button class="cmp-bottle" data-open="${o.id}"><span class="cmp-img">${face(o,true)}</span><b>${esc(o.n)}</b><small>${esc(o.t)}</small></button>`).join('')}</div>
    <div class="cmp-table">
      ${rowOf('도수',o=>esc(abvTxt(o)))}${rowOf('숙성',o=>esc(o.age))}${rowOf('산지',o=>esc(o.r.split(' · ').slice(0,2).join(' · ')))}
      ${rowOf('숙성 통',o=>esc(o.cask))}
      ${rowOf('피트·연기',o=>bar(o.p,4,'peat'))}${rowOf('무게감',o=>bar(o.b,5))}${rowOf('단맛·과일',o=>bar(o.s,5))}${rowOf('셰리 영향',o=>bar(o.sy,3))}
      ${rowOf('향',o=>esc(o.nose))}${rowOf('맛',o=>esc(o.pal))}${rowOf('여운',o=>esc(o.fin))}${rowOf('마시는 법',o=>esc(o.drink))}${rowOf('난이도',o=>level(o))}
    </div>
    <p class="foot">병을 누르면 자세한 설명이 열립니다. 점수는 이 페이지에서 비교하려고 붙인 대략적인 값입니다.</p>
  </div>`,'#cmp',push);
}
function closeDetail(fromHash){
  const sheet=document.getElementById('sheet');
  sheet.classList.remove('on');document.getElementById('scrim').classList.remove('on');
  setTimeout(()=>{if(!sheet.classList.contains('on'))sheet.hidden=true},300);
  if(!fromHash && (location.hash.startsWith('#b-')||location.hash==='#cmp')){ try{history.pushState(null,'',location.pathname+location.search)}catch(e){location.hash=''} }
}
function route(){
  const h=location.hash;
  if(h.startsWith('#b-')) openDetail(h.slice(3),false); else if(h==='#cmp') openCompare(false); else closeDetail(true);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-style]'); if(t){state.style=t.dataset.style;renderControls();renderShelves();try{localStorage.setItem('bb-style',state.style)}catch(_){};
    const top=document.querySelector('.bar').getBoundingClientRect().top+scrollY; if(scrollY>top) scrollTo({top:top,behavior:'smooth'}); return}
  const n=e.target.closest('[data-nat]'); if(n){state.nat=n.dataset.nat;renderControls();renderShelves();return}
  const f=e.target.closest('[data-flav]'); if(f){const id=f.dataset.flav;state.flav.has(id)?state.flav.delete(id):state.flav.add(id);renderControls();renderShelves();return}
  const fo=e.target.closest('[data-favonly]'); if(fo){state.favOnly=!state.favOnly;renderControls();renderShelves();return}
  const ft=e.target.closest('#ftoggle'); if(ft){const box=document.getElementById('chipbox');const open=box.classList.toggle('open');ft.setAttribute('aria-expanded',open);return}
  const fv=e.target.closest('[data-fav]'); if(fv){toggleFav(fv.dataset.fav);return}
  const cm=e.target.closest('[data-cmp]'); if(cm){toggleCmp(cm.dataset.cmp);return}
  const cx=e.target.closest('[data-cmpx]'); if(cx){toggleCmp(cx.dataset.cmpx);if(location.hash==='#cmp')openCompare(false);return}
  if(e.target.closest('[data-cmpclear]')){cmp=[];store.set('bb-cmp',cmp);refreshActs();renderTray();if(location.hash==='#cmp')closeDetail();return}
  if(e.target.closest('[data-cmpopen]')){openCompare();return}
  const op=e.target.closest('[data-open]'); if(op){openDetail(op.dataset.open);return}
  const b=e.target.closest('.bt'); if(b){openDetail(b.dataset.id);return}
  if(e.target.closest('#close')||e.target.id==='scrim'){closeDetail();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet').classList.contains('on'))closeDetail()});
document.getElementById('q').addEventListener('input',e=>{state.q=e.target.value.trim();renderShelves()});
window.addEventListener('hashchange',route);
window.addEventListener('popstate',route);
try{const s=localStorage.getItem('bb-style');if(s&&(s==='all'||STYLES.some(x=>x.id===s)))state.style=s}catch(_){}
renderStats();renderControls();renderShelves();renderFoot();renderTray();route();
</script>

</body>
</html>
